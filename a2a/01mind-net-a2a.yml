discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: 01mind.net
  note: >-
    Served from the apex host, which is also the OpenAPI servers[] host, the MCP host and the A2A JSON-RPC
    host — 01Mind runs everything on one Render-hosted origin behind Cloudflare. www.01mind.net 301s every
    /.well-known/* path to the apex. The legacy /.well-known/agent.json returns a real JSON 404
    ({"error":"Not found"}, 21 bytes), not an SPA shell, and a negative-control path
    (/.well-known/01mind-net-negative-control-9c4e21d7.json) also 404s, so the 200 on agent-card.json is
    a served document and not a catch-all. Ownership is not in question: the card's provider.organization is
    "01Mind" with provider.url https://01mind.net, the OpenAPI at the same host titles itself "01Mind Agent
    Superstore API" with termsOfService https://01mind.net/terms, and the Terms of Sale name the A2A channel
    explicitly (clause 1.3).
