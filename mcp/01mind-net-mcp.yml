    with columns:[...]}), or templateId + values. Optional filename. Free for the first 5 documents a
    month on an API key sent as X-API-Key, then $0.25 per document via x402 -- an unpaid call over that
    returns a real HTTP 402 challenge. Dry run free at POST /sandbox/execute/render-document. Full schema
    and limits: call list_offerings with section "documents".'
- name: save_document_template
  description: 'Free, and does not use your document allowance. Store a reusable layout once so you stop
    re-sending it: send format, blocks (or sheets), an optional templateId, with {{placeholders}} where
    values go, and a table may carry rowsFrom:"listName" to repeat one row over an array. Then render
    with { templateId, values }. Requires an API key (X-API-Key). Saves a large layout from being re-sent
    on every call, which is usually the single largest avoidable cost in a request.'
