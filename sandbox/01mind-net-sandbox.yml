summary: >-
  01Mind has no separate test environment or test-mode keys; production is the sandbox. Its rehearsal surface
  is a free, unauthenticated dry-run route that performs the identical validation the paid call performs and
  reports what would be produced without producing a file or consuming anything, plus a free API key with no
  signup and a set of first-party document templates any caller can render against.
test_vs_live:
  separate_environment: false
  key_prefixes: not published
  note: One host, one key type. The dry run is the only "test mode".
dry_run:
  operation: 'POST /sandbox/execute/{listingId} (no operationId)'
  cost: free — no key and no payment required
  behaviour: >-
    "Runs the identical validation the paid call runs and reports exactly what would be produced -- final
    sanitised sheet names, block counts, and every warning -- without producing a file and without consuming
    an allowance or a credit." For render-document it is "the real validator for blocks and sheets".
  guarantee: 'A malformed payload on the paid route is also rejected before anything is consumed: "a mistake never costs you a document."'
free_api_key:
  operation: 'POST /keys (documented in prose; not declared in the OpenAPI paths)'
  body: empty or {}
  signup: none
  identity_attached: none — "An API key is issued on request with no name, email address or identity attached to it" (privacy policy)
  carries: 5 free rendered documents per month; ownership of saved templates; recognition on return visits
  usage_check: 'GET /usage/{keyId} (documented in prose; live probe without a key returned 401)'
