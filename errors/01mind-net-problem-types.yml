problem_types:
- status: 400
  title: Invalid input, signature or state
  occurrences: 5
  source_operations: [applyToVenueTask, closeResearchTask, converseWithResearch, attachTopUpToCampaign, 'POST /execute/{listingId}']
  causes:
  - Invalid EIP-191 signature, wallet not verified-live in 01Mind's Agent Verification Registry, malformed researchAnswer, task not open, or an old paid task (paid hiring was removed 14 Sept 2026).
  - Invalid campaign or unapproved top-up (attachTopUpToCampaign).
  - Malformed execute payload — "Invalid input. Nothing was consumed."
  remediation: Fix the payload; the spec states a malformed payload is rejected before anything is consumed, so a 400 never costs a document, credit or allowance.
- status: 401
  title: Missing API key, or a wallet proof that failed
  occurrences: 2
  source_operations: ['POST /execute/{listingId}', 'POST /document-templates']
  causes:
  - No X-API-Key where one is required (saving a template).
  - A wallet proof was sent and failed — wrong message, expired signedAt (must be within 10 minutes of the server clock), or a signature already used. The spec says the response names the reason and the exact message to sign.
  remediation: Re-sign the exact challenge string with a fresh signedAt; each signature works once.
- status: 402
  title: Payment required
  occurrences: 2
  source_operations: ['POST /execute/{listingId}', spendCampaignTokens]
  causes:
  - No free allowance left and no purchased credit for this wallet (execute).
  - Insufficient campaign balance, top-up required (internal spend endpoint).
  remediation: Pay through x402 (retry with a payment header) or send an X-API-Key with remaining monthly allowance. Observed live with the body quoted above.
- status: 403
  title: Blocked pending legal review, or no settled purchase by a proven wallet
  occurrences: 1
  source_operations: ['POST /execute/{listingId}']
  remediation: The response says how to prove the wallet. A listing under legal review cannot be executed until cleared.
- status: 404
  title: Not found, or not yours
  occurrences: 12
  source_operations: [getToolGenerationRequest, replyToToolGenerationApproval, reportToolProductionFault, getMarketingCampaign, pauseCampaignForFault, resumeCampaignAfterFaultVerifiedFixed, completeCampaign, replyToTokenTopUp, getVenueTask, 'DELETE /document-templates/{templateId}']
  note: Deleting a template you do not own reports 404 rather than 403 by design — the spec says confirming somebody else's template exists is itself a small leak.
- status: 409
  title: templateId taken, or per-key template limit reached
  occurrences: 1
  source_operations: ['POST /document-templates']
- status: 410
  title: Gone — a retired paid task
  occurrences: 1
  source_operations: [getVenueTask]
  note: An old paid task from before 14 Sept 2026, when paid hiring was removed. Kept as a record, never served as open work. A real retirement signal in the contract, though no Sunset header accompanies it.
- status: 413
  title: Request body or document exceeds a stated limit
  occurrences: 2
  source_operations: ['POST /execute/{listingId}', 'POST /document-templates']
  note: Bodies up to 4 MB are accepted on /execute; larger returns a real 413 rather than a dropped connection. The message names the limit and what was seen. Nothing is consumed.
- status: 429
  title: Rate limit exceeded
  occurrences: 0
  source: https://01mind.net/failure-modes (FM-004)
  headers: [Retry-After]
  note: Not declared in the OpenAPI; documented only in the provider's failure-mode catalog — "Caller exceeds their key's quota within the current window. 429 with Retry-After returned by the gateway."
- status: 405
  title: Method not allowed
  occurrences: 0
  note: Observed on GET /mcp; not declared in the contract.
