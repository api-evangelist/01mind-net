- id: x402
  name: x402 HTTP payment protocol
  conforms: true
  verification: partial
  evidence: POST https://01mind.net/execute/render-document with an empty body returned HTTP 402 with a JSON body naming the price ($0.25), the free-allowance path (X-API-Key) and the wallet-proof path; the OpenAPI declares 402 on /execute/{listingId} and /campaigns/{campaignId}/spend; the Terms of Sale 4.2 state payment is "USDC on the Base network, either through the x402 payment protocol or through the Agent Commerce Protocol's escrow"; the card and MCP instructions both name x402.
  note: >-
    The 402 status and the provider's declarations were observed. The x402 PaymentRequirements payload on the
    /purchase leg was NOT observed, because reaching it means posting to the purchase route, which this
    pipeline does not do. Recorded as conforming on the provider's own contract and an observed 402, with
    the payload unverified.
