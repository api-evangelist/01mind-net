summary: >-
  01Mind's conformance profile is the agent-commerce protocol stack rather than any enterprise or sector
  standard: an A2A 0.3.0 agent card with the a2a-x402 payment extension declared as required, an MCP server
  at protocol version 2025-06-18, JSON-RPC 2.0 on both, x402 (HTTP 402) payment settled in USDC on Base
  (CAIP-2 eip155:8453), and EIP-191 personal_sign wallet proofs as the collection credential. It declares no
  OAuth/OIDC, no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 9727 API catalog and no
  RFC 8594 sunset signalling. The Terms of Sale also name the Agent Commerce Protocol as a channel, which
  could not be verified on any surface.
