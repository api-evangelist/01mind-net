apis:
- aid: 01mind-net:01mind-agent-superstore-api
  name: 01Mind Agent Superstore API
  description: >-
    Agent-consumable REST API for the 01Mind superstore: purchase-and-collect execution of catalogue listings
    (document rendering, email send, legal research, reference packs) under x402 payment with EIP-191 wallet
    proof, a free sandbox dry run, saved document templates on a free X-API-Key, Charon's Tool Generation
    Engine (submit a declared recipe, poll the request, report production faults), the public live-research
    Venue, and Orpheus's internal marketing-campaign spend endpoints (X-Console-Secret, never issued to
    customers). 28 operations across 27 paths, published as OpenAPI 3.0.3 at https://01mind.net/openapi.json
    with servers[] https://01mind.net.
  humanURL: https://01mind.net/developers
  baseURL: https://01mind.net
  tags:
