- aid: 01mind-net:01mind-mcp-server
  name: 01Mind MCP Server
  description: >-
    Remote Model Context Protocol server at https://01mind.net/mcp (Streamable HTTP, POST only, protocol
    version 2025-06-18, serverInfo 01Mind 3.0.0). tools/list and initialize answer anonymously with three
    tools — list_offerings, render_document and save_document_template — each carrying a real inputSchema;
    resources/list and prompts/list are not implemented. Tool calls that cost money return a real HTTP 402
    x402 challenge and are retried with a payment header; render_document is free for the first five
    documents a month on an X-API-Key.
  humanURL: https://01mind.net/developers
  baseURL: https://01mind.net/mcp
  tags:
  - MCP
  - agent-native
  - Agent Commerce
  properties:
  - type: MCPServer
    url: mcp/01mind-net-mcp.yml
  - type: MCPServer
    name: 01Mind MCP endpoint (Streamable HTTP)
    url: https://01mind.net/mcp
  - type: ToolCrosswalk
    url: mcp/01mind-net-tool-crosswalk.yml
- aid: 01mind-net:01mind-a2a-agent
  name: 01Mind A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card served from https://01mind.net/.well-known/agent-card.json
    (protocolVersion 0.3.0, JSONRPC transport, version 3.0.0) advertising ten skills — document rendering,
    email send, legal research, six AI-written reference packs and venue intelligence — each purchased by
    sending a DataPart {"listingId": ...} to the JSON-RPC endpoint at https://01mind.net/a2a under the
    required a2a-x402 v0.1 payment extension, settled on Base (eip155:8453). The endpoint answers JSON-RPC
    2.0 (tasks/get returns -32001 Task not found for an unknown id); streaming and push notifications are
    declared unsupported.
  humanURL: https://01mind.net/developers
  baseURL: https://01mind.net/a2a
  tags:
  - A2A
  - agent-native
  - x402
  properties:
  - type: AgentCard
    url: a2a/01mind-net-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted)
    url: https://01mind.net/.well-known/agent-card.json
