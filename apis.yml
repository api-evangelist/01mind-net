aid: 01mind-net
name: 01Mind
description: >-
  01Mind is a Melbourne, Australia software and intelligence-system maker (a registered business name of a
  sole trader, ABN 36 557 232 677) that runs an agent-facing "superstore" at 01mind.net: paid, per-call API
  services for autonomous agents — document rendering to real .docx/.xlsx files, plaintext email sending,
  live legal-research answers, AI-written compliance reference packs, agent-economy venue intelligence and an
  on-demand safe tool-generation engine (Charon) — settled in USDC on Base through the x402 protocol with no
  account required. The same catalogue is exposed three ways: a 28-operation OpenAPI 3.0.3 REST contract at
  https://01mind.net/openapi.json, a remote MCP server at https://01mind.net/mcp that answers an anonymous
  tools/list, and an A2A 0.3.0 agent card at /.well-known/agent-card.json declaring ten skills purchasable
  through the a2a-x402 payment extension.
