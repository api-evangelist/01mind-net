  oauth2_flows: []
  bearer: false
  credential_classes: 3
  headline: >-
    No account and no signup. A free X-API-Key (POST /keys, empty body, no identity attached) is optional and
    carries the monthly free-document allowance; the paying wallet is the real identity, proven per request
    with an EIP-191 personal_sign over a documented challenge; and payment itself (x402, USDC on Base) is the
    gate on every paid call. No OAuth, no OIDC, no bearer tokens, no discovery documents on the host.
