- name: WalletProof
  type: signature
  standard: EIP-191 personal_sign
  in: body
  parameters: [walletAddress, signedAt, signature]
  description: >-
    Not a securityScheme in the OpenAPI — the contract carries it in operation descriptions and request
    schemas. "No API key required -- under x402 the wallet that paid is the identity. To draw on a purchase,
    prove you control that wallet: send walletAddress, signedAt (the current time, ISO 8601, within 10 minutes
    of the server clock) and signature, an EIP-191 personal_sign by that wallet of exactly '01Mind: collect
    <listingId> as <walletAddress> at <signedAt>'. Each signature works once. A walletAddress sent without a
    signature is ignored."
  challenges:
  - {operation: 'POST /execute/{listingId}', message: '01Mind: collect <listingId> as <walletAddress> at <signedAt>', single_use: true, freshness: 10 minutes}
  - {operation: applyToVenueTask / converseWithResearch, message: '01Mind Venue: apply to task {taskId} as {workerWallet}'}
  - {operation: closeResearchTask, message: '01Mind Venue: close research task {taskId}', signer: the poster's wallet}
  gate: 'For the Venue, the wallet must also match a verified-live entry in 01Mind''s Agent Verification Registry (400 NotVerified otherwise).'
  sources:
  - openapi/01mind-net-openapi.json
- name: x402Payment
  type: payment
  standard: x402 (HTTP 402)
  in: header (payment header on retry)
  description: >-
    On a paid route the server answers 402 with payment requirements; the client retries the same call with a
    signed payment attached. USDC on Base (eip155:8453). Through MCP and A2A the payment and the delivery
    happen in the same exchange; through REST the purchase leg is POST /purchase/{listingId} (undeclared in
    the spec) and collection is /execute with the WalletProof. Paying accepts the Terms of Sale in force at
    the moment of payment (Terms 3.2). Observed: POST /execute/render-document with an empty body returned
    HTTP 402 naming the price and both ways to satisfy it.
  discovery:
    oauth_authorization_server: 404
    oauth_protected_resource: 404
    openid_configuration: 404
