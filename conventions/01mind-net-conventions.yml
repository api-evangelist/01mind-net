request_id_tracing:
  supported: false
  note: >-
    No request-id or correlation-id header is declared or documented. Responses carry rndr-id and cf-ray,
    which are Render's and Cloudflare's platform trace ids, not a contract the provider commits to.
    RenderDocumentResult.sha256 is offered instead as the dispute anchor: "Checksum of the returned bytes, so
    a delivery dispute can be settled without either side retaining the document."
