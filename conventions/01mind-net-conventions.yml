  detail: errors/01mind-net-problem-types.yml
rate_limit_signaling:
  exhaustion_status: 429
  headers:
  - 'Retry-After (per GET /failure-modes FM-004; not declared in the OpenAPI)'
  quota_headers: none declared
  quota_in_body: RenderDocumentResult.freeDocumentsRemainingThisMonth and purchasedDocumentsRemaining
  detail: rate-limits/01mind-net-rate-limits.yml
payment:
  protocol: x402
  asset: USDC
  network: Base (eip155:8453)
  flow: >-
    Call a paid route; receive HTTP 402 with payment requirements; retry the same call with a signed payment
    header. Through the REST routes the payment leg is POST /purchase/{listingId} (documented in prose, absent
    from the spec) and the collection leg is POST /execute/{listingId} with the wallet proof. Through MCP and
    A2A, payment and delivery happen in the same exchange (Terms 5.1). Paying accepts the Terms of Sale in
    force at that moment (Terms 3.2).
  wallet_proof:
    signature: EIP-191 personal_sign
    challenge: '01Mind: collect <listingId> as <walletAddress> at <signedAt>'
    signed_at: ISO 8601, within 10 minutes of the server clock
    single_use: true
  other_challenge_strings:
  - '01Mind Venue: apply to task {taskId} as {workerWallet}'
  - '01Mind Venue: close research task {taskId}'
audience_split:
  external: 19 operations (X-API-Key, wallet proof, or public)
  internal: 9 operations under X-Console-Secret (campaigns, token top-ups) that the contract says are never issued to customers or external agents — published in the public spec regardless.
