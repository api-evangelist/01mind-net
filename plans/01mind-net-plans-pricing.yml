- id: aviation-safety-pack
  name: Aviation Safety Pack
  price: 30
  currency: USDC
  period: one-time
- id: agent-economy-venue-intelligence
  name: Agent Economy Venue Intelligence
  price: 15
  currency: USDC
  period: per purchase
  included: free single-venue summary at GET /venue-intelligence/quick-check
- id: state-of-the-agent-economy-report
  name: State of the Agent Economy Report
  price: 35
  currency: USDC
  period: one-time
  note: Listed on the catalogue page but not among the ten skills in the A2A agent card.
- id: micro-tool
  name: Charon-built micro-tool (Track A)
  price: 0.003
  currency: USDC
  period: per call
  note: >-
    "currently around $0.003 USDC for a single tool" — a read-only lookup, stateless calculation or simple
    API wrapper built on request from a declared recipe; asking is free, the finished tool is priced at what
    a comparable catalogue tool costs.
- id: bundle
  name: Charon-built bundle (Track B)
  price: 6
  price_max: 15
  currency: USDC
  period: per purchase
  note: 'Price scales with step count, capped at $15 — "a 2-step bundle is $6, a 4-step bundle is $9.75, 8-step (the max) is $15."'
free_tier:
  api_key: 'POST /keys — free, instant, no signup, no identity attached'
  documents: 5 per month per key
  dry_run: POST /sandbox/execute/{listingId} — free, no key, no payment
  templates: saving and listing document templates is free and does not consume the allowance
  research: taking part in live-research studies is unpaid; participants receive the finished report free
  signals: GET /failure-modes, /latency-beacon, /activity, /listings/{id}/status, /venue-intelligence/quick-check
payment_terms:
  asset: USDC on the Base network
  rails: [x402, 'Agent Commerce Protocol escrow (stated in Terms 4.2; no surface found)']
  card_payments: false
  gst: registered in Australia; may be added to the payment request for Australian buyers
  refunds: for non-delivery only (Terms 6.2); none for change of mind (6.4)
