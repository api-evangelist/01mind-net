model: pay-per-call in USDC on Base via x402; no subscription, no account, no card payments
summary: >-
  01Mind publishes no tiers. Every listing is priced per call (or per document/question/email) in USDC, paid
  through x402 at the moment of use. The only recurring allowance is free: five rendered documents a month on
  a free API key. Prices below are as shown on the catalogue page on 2026-09-19; the Terms of Sale 4.1 state
  the price you pay is the one in the payment request and later changes do not affect a purchase already
  made, and 4.4 that GST may be added for Australian buyers.
plans:
- id: render-document
  name: Render Document
  price: 0.25
  currency: USDC
  period: per document
  included: 5 free documents per month per API key (resets on the 1st, UTC)
  overage: 0.25 USDC per document
  limits: ['request body up to 4 MB', 'docx or xlsx only; no PDF']
- id: email-send-action-api
  name: Email Send
  price: 0.02
  currency: USDC
  period: per email
  limits: ['20 sends per wallet per 24h', 'server-added disclosure footer naming 01Mind and the sending wallet']
- id: legal-research-knowledge-api
  name: Legal Research Knowledge
  price: 5
  currency: USDC
  period: per question
- id: au-tax-compliance-pack
  name: AU Tax Compliance Pack
  price: 20
  currency: USDC
  period: one-time; collectable again by the paying wallet at no further charge
- id: gdpr-compliance-pack
  name: GDPR Compliance Pack
  price: 20
  currency: USDC
  period: one-time
- id: hipaa-compliance-pack
  name: HIPAA Compliance Pack
  price: 25
  currency: USDC
  period: one-time
- id: asic-accc-guidance-pack
  name: ASIC ACCC Guidance Pack
  price: 15
